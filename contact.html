<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ — ズレ計</title>
<meta name="description" content="ズレ計へのご質問・ご指摘・データ修正提案はこちらから。">
<meta property="og:site_name" content="ズレ計">
<meta property="og:type" content="website">
<meta property="og:title" content="お問い合わせ — ズレ計">
<meta property="og:description" content="ズレ計へのご質問・ご指摘・データ修正提案はこちらから。">
<meta property="og:url" content="https://zurekei.org/contact.html">
<meta property="og:image" content="https://zurekei.org/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css?v=20260729">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  .contact-page-wrap {
    max-width: 680px;
    margin: 60px auto 120px;
    padding: 0 24px;
  }

  .contact-page-wrap h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .contact-page-wrap .lead {
    font-size: 15px;
    color: #888;
    line-height: 1.8;
    margin-bottom: 48px;
  }

  .form-group {
    margin-bottom: 24px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: #333;
  }

  .form-group label span {
    color: #d32f2f;
    margin-left: 2px;
  }

  .form-group input[type="text"],
  .form-group input[type="email"],
  .form-group input[type="url"],
  .form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e0e0e0;
    border-radius: 2px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
    color: #101010;
    transition: border-color 0.2s;
    outline: none;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #1976d2;
  }

  .form-group textarea {
    height: 160px;
    resize: vertical;
  }

  .cf-turnstile {
    margin-bottom: 24px;
  }

  .submit-btn {
    background: #101010;
    color: #fff;
    border: none;
    padding: 12px 36px;
    font-size: 14px;
    font-family: inherit;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s;
  }

  .submit-btn:hover {
    background: #333;
  }

  .submit-btn:disabled {
    background: #aaa;
    cursor: not-allowed;
  }

  .form-msg {
    margin-top: 24px;
    padding: 16px 20px;
    border-radius: 2px;
    font-size: 14px;
    display: none;
  }

  .form-msg.success {
    background: #f1f8e9;
    border: 1px solid #c5e1a5;
    color: #558b2f;
  }

  .form-msg.error {
    background: #ffebee;
    border: 1px solid #ef9a9a;
    color: #c62828;
  }

  .form-msg.show {
    display: block;
  }

  @media (max-width: 768px) {
    .contact-page-wrap {
      margin: 40px auto 80px;
    }

    .contact-page-wrap h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ズレ計 トップへ">
      <svg class="brand-logo" viewBox="0 0 512 512">
        <path d="M235,205 C245,150 295,105 365,95 C405,88 440,98 447,122 C450,138 440,148 425,145 C435,165 420,188 392,200 C355,213 285,208 235,205 Z" fill="#D4482E"></path>
        <path d="M57,264 C90,248 135,240 180,241 L180,288 C135,286 92,280 57,264 Z" fill="#E8A13D"></path>
        <circle cx="300" cy="290" r="130" fill="#1B2A4A"></circle>
        <path d="M188,380 A130,130 0 0 0 400,392" fill="none" stroke="#3A4A6B" stroke-width="3" stroke-linecap="round" opacity="0.55"></path>
        <circle cx="299" cy="245" r="35" fill="#E1DFDC"></circle>
        <circle cx="289" cy="250" r="15" fill="#111318"></circle>
        <circle cx="283" cy="244" r="3.5" fill="#F2EFE8"></circle>
      </svg>
      <div>
        <div class="brand-name">
          <span class="brand-name-main">zurekei</span>
          <span class="brand-name-slash">~/</span>
        </div>
        <div class="brand-tag">FORECAST × ACTUAL</div>
      </div>
    </a>
    <div class="header-right">
      <div class="lang-toggle">
        <button id="lang-ja" class="lang-btn mono">JA</button>
        <button id="lang-en" class="lang-btn mono">EN</button>
      </div>
    </div>
  </header>

  <a class="chart-back" id="t-back" href="index.html">← 指標一覧</a>

  <div class="contact-page-wrap">
    <h1 id="contact-title">お問い合わせ</h1>
    <p class="lead" id="contact-lead">
      ズレ計についてのご質問、データの誤りご指摘、見通し値・実績値の修正提案などはこちらから。
    </p>

    <form id="contactForm">
      <div class="form-group">
        <label id="label-name">お名前<span>*</span></label>
        <input type="text" id="name" placeholder="例：山田 太郎" required>
      </div>

      <div class="form-group">
        <label id="label-email">メールアドレス<span>*</span></label>
        <input type="email" id="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label id="label-affiliation">所属・肩書</label>
        <input type="text" id="affiliation" placeholder="例：○○大学 経済学部（任意）">
      </div>

      <div class="form-group">
        <label id="label-message">お問い合わせ内容<span>*</span></label>
        <textarea id="message" placeholder="ご質問・ご指摘をご記入ください" required></textarea>
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAD_Ft12YrgynMDEM" data-appearance="interaction-only"></div>

      <button type="submit" class="submit-btn" id="submitBtn" data-text="送信する">送信する</button>

      <div class="form-msg success" id="successMsg">
        ✓ お問い合わせを受け付けました。ご返信までお待たせする場合がございます。
      </div>
      <div class="form-msg error" id="errorMsg">
        × 送信に失敗しました。時間をおいて再度お試しください。
      </div>
    </form>
  </div>
</div>

<script src="contact.js?v=20260729"></script>
</body>
</html>
