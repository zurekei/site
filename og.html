<!doctype html>
<html lang="ja">

<title>OGP画像生成用 — ズレ計</title>
<!-- assets/og*.png(汎用2枚 + 指標8種×2言語の16枚 + 扇形ページ2種×2言語の4枚 =
     計22枚)の生成元ページ。
     1200x630の枠を実データ(og.htmlがfetchするCSV。?mの有無で対象が変わる。
     下記参照)から描画し、ヘッドレスChromeでスクリーンショットしてOGP画像に
     する。サイト本体からはリンクしない。
     ?lang=en を付けると英語カードを描く(既定はja)。?shot と併用する場合は
     ?shot&lang=en のように両方付ける。
     ?m=<chart.jsのMETRICSキー> を付けると、その指標専用のカード(タイトル・
     年度レンジ・CSV・単位・y軸すべてがその指標のもの)を描く。省略時は
     従来どおり実質GDPの汎用カード(?mなし=gdp_forecast.csvのforecast_real/
     actual_real固定)。?m=fertility と ?m=births は予約値で、chart.jsのMETRICSを
     一切引かず(fertility.js / births.js も読み込まない。理由はbin/build.mjsの
     OG_INPUT_RELS直上コメント参照)、歴代の推計(版ごと)を重ねた扇+実績という
     指標カードとは別系統の描画(renderFan()。main()内でMETRICSを引くより前に
     分岐する)になる。予約値の一覧と、その2種の違い(CSV・列名・y軸の規則)は
     下のFAN_SPECSが唯一の出所。
     ?m に METRICS にも無く FAN_SPECS にも無いキーを渡すと明示的にthrowして
     壊れる(黙って汎用カードにフォールバックしない)。
     汎用2枚+指標8種×2言語+扇形2種×2言語=計22枚を bin/og.sh で一括して焼き直す
     (2026-07-30、1指標1枚だった旧構成から18枚体制・複数CSVに拡張した後、
     同日中に出生率専用カードを足して20枚体制へ。2026-08-04に出生数を足して
     22枚体制へ)。 -->
<link rel="stylesheet" href="style.css?v=20260803a">
<style>
  html, body { background: #888; }

<body>
<div class="og-frame" id="og-frame">
  <div class="og-header">
    <div class="og-brand">
      <svg class="og-brand-logo" viewBox="0 0 512 512">
        <path d="M235,205 C245,150 295,105 365,95 C405,88 440,98 447,122 C450,138 440,148 425,145 C435,165 420,188 392,200 C355,213 285,208 235,205 Z" fill="#D4482E"></path>

        <path d="M188,380 A130,130 0 0 0 400,392" fill="none" stroke="#3A4A6B" stroke-width="3" stroke-linecap="round" opacity="0.55"></path>
        <circle cx="299" cy="245" r="35" fill="#E1DFDC"></circle>
        <circle cx="289" cy="250" r="15" fill="#111318"></circle>

      </svg>
      <div>
        <div class="og-brand-name"><span id="og-brand-main">ズレ計</span><span class="og-brand-slash" id="og-brand-slash">zurekei ~/</span></div>

  <div class="og-chart">

      <span class="og-legend-item"><span class="og-legend-swatch og-legend-swatch-forecast"></span><span id="og-legend-forecast">見通し</span></span>
      <span class="og-legend-item"><span class="og-legend-swatch og-legend-swatch-actual"></span><span id="og-legend-actual">実績</span></span>
      <!-- JSが必ず上書きする場所。以前はここに「実質GDP成長率 1980–2025年度」と
           完成形そっくりの文字列を置いていたが、2026-07-30に「…」へ変えた。
           bin/og.sh の verify_dom はフッタが「<期待最小年度>–」を含むかを見て
           JSの失敗を検出しているのに、この置き文字列が "1980–" を含むため、
           期待最小年度が1980のカード(実質/名目GDP・消費者物価)ではJSが完全に
           失敗しても検査(a)が通ってしまっていた(実績線の検査(b)が別に落ちるので
           全体としては止まっていたが、検査が1本死んでいるのは検査が無いのと
           同じ)。置き文字列を完成形に似せない、が唯一の直し方。 -->
      <span id="og-footer-range">…</span>
    </div>
    <div class="og-domain">zurekei.org</div>
  </div>
</div>
<script src="csv.js?v=20260803a"></script>
<script>
if (location.search.includes("shot")) document.body.classList.add("shot");

// このページは home.js 等を読み込まない独立ページ(スクリーンショット専用の
// 描画道具であってサイト本体の配信物ではない)ため、T辞書を共有する経路が無い。
// OG_TEXT[LANG].legendForecast/legendActual は home.js の T.en.plan/T.en.actual と
// 同じ文字列だが、あえてここにローカルで持つ: og.html は「人間が焼き直すための道具」であり、
// 焼いた画像を目で見た瞬間にズレていれば気づける(自動で配信されるHTMLの文言と
// 違い、ズレたまま静かに公開され続ける経路が無い)。このリポジトリは辞書の
// 複製を嫌うが、ここはその例外として意図的に許容している。
const OG_TEXT = {
  ja: {
    brandMain: "ズレ計",
    brandSlash: "zurekei ~/",
    titleMain: "政府経済見通し × 実績",
    titleSmall: "予測値・実績値・出典を毎年並べて記録する",
    legendForecast: "見通し",
    legendActual: "実績",
    // ?m なし(汎用カード)のフッタ: 指標名+年度レンジ(従来どおり)。
    footerRange: (min, max) => `実質GDP成長率 ${min}–${max}年度`,
    // ?m あり(指標カード)のフッタ: 年度レンジのみ。タイトル(#og-title-main)が
    // 既にその指標名を名乗っているので、フッタでは繰り返さない
    // (フッタが系列名を名乗るのは「タイトルが名乗っていないとき」だけ、という
    // 使い分け。2026-07-30、指標カード対応時に追加)。
    footerRangeMetric: (min, max) => `${min}–${max}年度`,
    // 扇形カード(?m=fertility / ?m=births)用(2026-07-30追加、2026-08-04に
    // 出生数を追加)。fertility.jsのT.titleは「合計特殊出生率 — 歴代推計 vs
    // 実績」だが、26pxの右寄せ枠に入れると特に英語版
    // ("Total fertility rate — successive projections vs actual")が折り返す
    // 危険が高いため、指標カードがmetric.title(短い形)を使っているのに揃えて
    // 短い形にする。出生数も同じ理由で短い形(home.jsのINDICATOR_METAの
    // nameJa/nameEnと同じ文字列)。
    titleFertility: "合計特殊出生率",
    titleBirths: "出生数",
    // 扇形の2ページはどちらも「年度」ではなく暦年(CSVはfiscal_yearではなく
    // year/target_year)。上のfooterRangeMetricの「…年度」表記をそのまま流用
    // すると、暦年しか持たない扇形カードに実在しない「年度」を書いてしまい
    // 内容として間違う。専用の関数を持つことで年度と暦年を書き分ける。
    footerRangeCalendar: (min, max) => `${min}–${max}年`,
    // 扇(歴代推計)の凡例文言。nはvintage_yearの異なる値の個数(データから導く。
    // ハードコードしない。renderFan()参照)。
    legendFan: (n) => `歴代${n}版の推計`,
    // 扇形カードのy軸ラベル。指標カードのような一般の単位付与ロジック
    // (metricUnit)には乗せず、ページごとの規則をここに置く(FAN_SPECSの
    // yLabelKeyがどれを使うかを指す)。出生率は無単位で小数1桁
    // (fertility.jsと同じ)、出生数は10000で割って「万」(births.jsのT.axisUnitと
    // 同じ規則)。
    axisFertility: (v) => v.toFixed(1),
    axisBirths: (v) => `${v / 10000}万`,
  },
  en: {
    brandMain: "zurekei",
    brandSlash: "~/",
    titleMain: "Government forecasts × actual outcomes",
    titleSmall: "Forecasts, actuals, and sources — recorded side by side, every year.",
    legendForecast: "Forecast",
    legendActual: "Actual",
    footerRange: (min, max) => `Real GDP growth, FY${min}–${max}`,
    footerRangeMetric: (min, max) => `FY${min}–${max}`,
    titleFertility: "Total fertility rate",
    titleBirths: "Number of births",
    // 年度接頭辞(FY)を付けない。上のjaのfooterRangeCalendarコメントと同じ理由。
    footerRangeCalendar: (min, max) => `${min}–${max}`,
    legendFan: (n) => `${n} successive projections`,
    axisFertility: (v) => v.toFixed(1),
    axisBirths: (v) => `${(v / 1000000).toFixed(1)}M`,
  },
};

const params = new URLSearchParams(location.search);
const LANG = params.get("lang") === "en" ? "en" : "ja";
const T = OG_TEXT[LANG];
document.documentElement.lang = LANG;
document.getElementById("og-brand-main").textContent = T.brandMain;
document.getElementById("og-brand-slash").textContent = T.brandSlash;
// #og-title-main は?mの有無で中身が変わる(汎用タグライン or 指標名)ため、
// main()内でmetricが確定してから設定する。#og-title-small(小見出し)は
// ?mに関わらず常に同じ汎用タグラインなのでここで確定させてよい。
document.getElementById("og-title-small").textContent = T.titleSmall;
document.getElementById("og-legend-forecast").textContent = T.legendForecast;
document.getElementById("og-legend-actual").textContent = T.legendActual;

const SVG_NS = "http://www.w3.org/2000/svg";
const W = 1088, H = 400;
// left は指標ごとの軸ラベル幅に応じてmain()内で広げる(estimateLabelWidth
// 参照)。ここでの52はその下限で、%表示の汎用カードはこの下限をそのまま採る。
const PAD = { top: 16, right: 20, bottom: 30, left: 52 };

function el(tag, attrs) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// og.html は home.js 等を読み込まない独立ページで、指標定義(METRICS)を持つ
// chart.js を <script src> では読み込めない(chart.jsの末尾のmain()はDOMを
// 触る独立ページ用の初期化コードで、ここではそれを実行してほしくない)。
// bin/build.mjs の loadModule() が使っている手をブラウザ側でも使う:
// ソースをfetchし、末尾のmain();を剥がしてからnew Functionで評価する。
// chart.jsのトップレベルが定義だけで副作用が無い(main()を剥がした残りが
// DOMを触らない)ことに依存している。ただし bin/build.mjs の loadModule() と
// 「同じ契約」ではなく、こちらの方が**より強い契約**に依存している
// (2026-07-30、H-2で「同じ」という不正確な記述を訂正): bin/build.mjs の
// loadModule() は評価前に csv.js のソース(CSV_SRC)を前置しているため、
// chart.jsのトップレベルがcsv.jsのシンボル(parseCSV等)に触れても動く。
// og.htmlのこのnew Functionはcsv.js無しで評価するため、chart.jsのトップ
// レベルがcsv.jsのシンボルに触れる形へ変わると、bin/build.mjs側は動き
// 続ける一方でこちら側だけが壊れる。fail-closed(壊れれば焼きが即座に
// エラーで止まる)なので危険ではないが、契約の強さが違う点は正確に書いて
// おく。new Functionの中で評価するため、chart.jsが持つトップレベルの
// const T / SVG_NS / PADはその関数のローカルスコープに閉じ、og.html側の
// 同名の定義(上のOG_TEXT用のT・SVG_NS・PAD)とは衝突しない。
async function loadChartModule() {
  // ?v=のキャッシュバスターは付けない(2026-07-30、I: 以前はstyle.css?v=/
  // csv.js?v=と揃えてASSET_Vという定数を持っていたが、焼きに対しては何も
  // 効いていなかった。bin/og.shの焼きは毎回新規プロファイル(--user-data-dir
  // を都度mktemp -dで作る)でキャッシュが無く、かつローカルのpython
  // HTTPサーバはクエリ文字列を無視して同じファイルを返すため。効くのは
  // 人間がブラウザでog.htmlを開いてデバッグするときだけで、それも
  // style.css?v=/csv.js?v=と手で揃える3箇所目になるのに揃いを守る検査は
  // 何も無く形骸化していた。次にここを見た人が「他の?v=と揃っていない」と
  // 誤解して足し直さないよう、このコメントを残す)。
  const src = await (await fetch("chart.js")).text();
  const stripped = src.replace(/\bmain\(\);\s*$/, "");
  if (stripped === src) {
    throw new Error("chart.js の末尾に main(); が見つからない(構造が変わった可能性がある)");
  }
  return new Function(`${stripped}\nreturn { METRICS, metricUnit };`)();
}

// 文字数からラベル幅を見積もる(実測ではない)。.axis-labelはIBM Plex Mono
// (等幅、15pxなら1文字9px)。CJK(兆円など)は等幅フォントに字が無く全角
// フォントへフォールバックするので約15px。よって
// 幅 ≒ ASCII文字数×9 + 非ASCII文字数×15。見積もりなので、焼いた画像は
// 必ず目視ではみ出しを確認すること(ここは機械では担保しない)。
//
// ■ 2026-07-30に判明した事実(コメントのみ修正・描画は変えない):
//   上の「15pxなら」という前提は<text>要素のfont-size属性(下のel()呼び出し
//   で"font-size": 15としている箇所)の値だが、実際にはstyle.cssの
//   `.axis-label { font-size: 11px }`(style.css:695)がSVGのpresentation
//   attributeであるfont-size="15"にCSSの仕様どおり勝つ(presentation
//   attributeは作者スタイルより弱い)。ヘッドレスChromeでcomputed 11pxで
//   あることを実測で確認済み。つまりこの見積もりは実態の約1.6倍で、
//   常にはみ出し方向に対して安全側に外れている(だから目視で問題が出て
//   いなかった)。font-size="15"という属性自体は今回の変更以前から
//   死んだ指定(効いていない指定)で、値は変えていない(見た目が変わるため。
//   直すかどうかの判断は別途人間がする)。
//   危険なのは将来: 誰かが.axis-labelの11px指定を消す、または属性どおり
//   15pxが効くようにすると、見積もりはちょうど実寸になり、余白は
//   maxTickWidth + 12 に対しラベル右端が PAD.left - 10 なので実質2pxしか
//   残らない。11px指定を消す・属性どおり15pxを効かせるといった変更を
//   するときは、この見積もり式と余白を見直すこと。
function estimateLabelWidth(text) {
  let w = 0;
  for (const ch of text) w += /[\x00-\x7f]/.test(ch) ? 9 : 15;
  return w;
}

// {1, 2, 5}×10^n の梯子を小さい方から試し、[yMin, yMax] に入る目盛の本数が
// 8本以下になった最初のものを刻み幅として採る。base×10^exp が step。
// base/expを別途返すのは、ラベルの小数桁数(tickLabel参照)を丸め誤差なく
// 決めるため(stepだけからだと10進の桁数が浮動小数の表現で崩れうる)。
function niceStep(yMin, yMax) {
  const bases = [1, 2, 5];
  for (let exp = -8; exp <= 12; exp++) {
    for (const base of bases) {
      const step = base * Math.pow(10, exp);
      const kMin = Math.ceil(yMin / step - 1e-9);
      const kMax = Math.floor(yMax / step + 1e-9);
      const count = kMax - kMin + 1;
      if (count >= 1 && count <= 8) return { kMin, kMax, base, exp };
    }
  }
  throw new Error("y軸の目盛刻み幅を決められなかった(定義域が異常な可能性がある)");
}

// k×base×10^exp を文字列化する。decimalsをbase/expから丸め誤差なく決め、
// toFixedしてからNumberに戻すことで、"0%"が"-0%"や
// "2.0000000000000004%"になるのを防ぐ(Number→toStringの往復は-0を"0"に
// 正規化する)。
function tickLabel(k, base, exp) {
  const decimals = Math.max(0, -exp);
  const v = Number((k * base * Math.pow(10, exp)).toFixed(decimals));
  return v.toString();
}

// 扇形カード(?m=fertility / ?m=births)の定義。ページごとに違うのはCSV2本・
// 値の列名・タイトル・y軸の規則だけで、扇の描き方(版ごとの線・不透明度・
// 欠測の橋渡しをしない区切り方)と実績線とx軸は完全に共通なので、下の
// renderFan()に1本化してここを差分として持つ(2026-08-04、出生数カードの
// 追加時。それまでは出生率専用のrenderFertility()だった)。
//
// **?m の予約値の一覧はこのオブジェクトが唯一の出所**。main()の分岐も
// `FAN_SPECS[m]` を引くだけで、予約値を別途列挙しない(片方だけ足して
// 「キーはあるのに描けない」状態になる経路を作らない)。
//
// yDomain がページごとの関数なのは、2つのページでy軸の決め方が本当に違う
// ため(出生率は fertility.js と同じ「最小値に1を含めて上下8%パディング」、
// 出生数は births.js と同じ「200000の倍数に切り上げ/切り下げ、パディング
// なし」)。無理に一般化するとどちらかのページとカードの見た目がずれる。
// 目盛りの刻み(yStep)から先はどちらも「stepの倍数のうちyMin以上を、yMaxまで
// 順に」で共通なのでrenderFan()側に置く。
//
// **ここに書いたCSVパス・列名は bin/build.mjs の FAN_CARDS と対になっている**
// (あちらは焼く前に minYear と扇の本数を数え、bin/og.sh の verify_dom が
// その期待値で焼き上がりを検査する)。片方だけ変えると検査が誤爆する。
const FAN_SPECS = {
  fertility: {
    forecastCsv: "data/fertility_forecast.csv",
    actualCsv: "data/fertility_actual.csv",
    forecastValCol: "assumed_tfr_mid",
    actualValCol: "actual_tfr",
    titleKey: "titleFertility",
    yLabelKey: "axisFertility",
    yStep: 0.2,
    // fertility.jsと同じ規則。og.html本体の指標カード用パディング(10%・0を
    // 含める)とは意図的に違う規則なので、niceStep()等の一般化ロジックには
    // 乗せない。
    yDomain: (vals) => {
      const lo = Math.min(...vals, 1);
      const hi = Math.max(...vals);
      const pad = (hi - lo) * 0.08 || 0.1;
      return [Math.max(0, lo - pad), hi + pad];
    },
  },
  births: {
    forecastCsv: "data/births_forecast.csv",
    actualCsv: "data/births_actual.csv",
    forecastValCol: "projected_births",
    actualValCol: "actual_births",
    titleKey: "titleBirths",
    yLabelKey: "axisBirths",
    yStep: 200000,
    // births.jsと同じ規則(yStepの倍数に丸めるだけ。パディングを足さない)。
    yDomain: (vals) => [
      Math.floor(Math.min(...vals) / 200000) * 200000,
      Math.ceil(Math.max(...vals) / 200000) * 200000,
    ],
  },
};

// 扇形カード(?m=fertility / ?m=births)専用の描画経路。指標カード
// (?m=<METRICSキー>)とはデータ・軸・凡例のすべてが違う(歴代の推計(版ごと)を
// 重ねた扇+実績 vs 見通し1本+実績1本)ため、main()がchart.jsのMETRICSを引くより
// 前に完全に別関数へ振り分ける(2026-07-30追加)。fertility.js / births.js の
// main()を参考にしているが、カードに要らないもの(版ラベルとその衝突回避・
// アニメーション・単点の丸・表・出典行)は持ち込まない。
//
// ■ 出生数カードは推計の基準の違い(＊印)を描かない(2026-08-04、意図的)
//   /births のページ側は、総人口ベースの版に＊を付けて実績(日本人ベース)と
//   基準が違うことを明示している。カードにはその印も凡例も無い: カードは
//   版ラベルを一切描かない(上記のとおり版ごとの線しか無い)ので、印を付ける
//   相手がそもそも居ない。基準の差は2021年で約1.8万人=このカードのy軸
//   (40万〜160万を630pxで描く)ではおよそ1px相当で、線としては見えない。
//   数値も一切書かないため、カードだけを見て基準を取り違える読み方は生じ
//   ない。基準の話はページ本文(scopeNote)が唯一の出所であり続ける。
async function renderFan(spec) {
  const [forecastRaw, actualRaw] = await Promise.all([
    loadCSV(spec.forecastCsv),
    loadCSV(spec.actualCsv),
  ]);

  // 空でない非数値セル(転記ミスの `1.49x934`・全角数字・単位の混入など)は
  // csv.jsのtoNum()がnullではなく**NaNを返す**。`!== null` のフィルタはNaNを
  // 素通しし、1個混ざるだけでMath.min/Math.max経由でy軸の定義域がNaNになり、
  // 扇と実績線の**全pathのy座標が非数になって1本も描かれない**。
  // (ここに壊れたd属性の実例を文字列として書かないこと。--dump-domは
  //  <script>の中身もDOMとして吐くため、bin/og.shのNaN検査が自分のコメントに
  //  マッチして全カードで誤爆する。2026-07-30に実際に踏んだ。)
  // bin/og.shのd属性NaN検査でも捕まえるが、そちらは「どこかにNaNがある」しか
  // 言えないので、読み込み時にどの列かを名指しして止める(2026-07-30追加。
  // bin/build.mjsのfanCardInfo()も同じ規則で弾く。両側が同じ規則で
  // 「黙って捨てる」ことにすると、今度は本数が両側で揃ってしまい
  // 「1本欠けた扇」が静かに通るので、捨てずに必ず投げる)。
  const reqNum = (raw, where) => {
    const v = Number(raw);
    if (!Number.isFinite(v)) throw new Error(`${where}: 数値として読めない(${JSON.stringify(raw)})。CSVの転記ミスの可能性`);
    return v;
  };
  const optNum = (raw, where) => {
    const v = toNum(raw);
    if (v !== null && !Number.isFinite(v)) {
      throw new Error(`${where}: 空でないのに数値として読めない(${JSON.stringify(raw)})。CSVの転記ミスの可能性`);
    }
    return v;
  };

  const FC = spec.forecastCsv;
  const AC = spec.actualCsv;

  // 列名がCSVのヘッダに実在するかを先に見る(2026-08-04、FAN_SPECSで列名を
  // 差し替え可能にしたときに追加)。csv.jsのtoNum()は**存在しない列(undefined)
  // をnullにする**ので、FAN_SPECSの列名を綴り間違えると全行がnullになり、
  // 下の`!== null`フィルタで静かに全部消えて「扇が0本の空のカード」が焼ける。
  // しかもbin/build.mjs側のFAN_CARDSが同じ綴り間違いを持っていれば、あちらも
  // vintageCount=0と数えるので bin/og.sh の verify_fan は 0==0 で通ってしまう
  // (両側が自己整合的に「正常」と答える、このリポジトリが何度も踏んでいる
  // 型の穴)。ヘッダを直接見れば、その一致が起きる前に止まる。
  const requireCol = (rows, col, where) => {
    if (rows.length && !(col in rows[0])) {
      throw new Error(`${where}: 列 "${col}" がCSVのヘッダに無い(FAN_SPECSの列名の綴り違いの可能性)`);
    }
  };
  requireCol(forecastRaw, spec.forecastValCol, FC);
  requireCol(actualRaw, spec.actualValCol, AC);

  const forecastRows = forecastRaw
    .map((r) => ({
      vintageYear: reqNum(r.vintage_year, `${FC} vintage_year`),
      targetYear: reqNum(r.target_year, `${FC} target_year`),
      val: optNum(r[spec.forecastValCol], `${FC} ${spec.forecastValCol}`),
    }))
    .filter((r) => r.val !== null);

  const actualRows = actualRaw
    .map((r) => ({ year: reqNum(r.year, `${AC} year`), val: optNum(r[spec.actualValCol], `${AC} ${spec.actualValCol}`) }))
    .filter((r) => r.val !== null)
    .sort((a, b) => a.year - b.year);

  const vintages = [...new Set(forecastRows.map((r) => r.vintageYear))].sort((a, b) => a - b);
  const byVintage = vintages.map((vy) => ({
    vintageYear: vy,
    rows: forecastRows.filter((r) => r.vintageYear === vy).sort((a, b) => a.targetYear - b.targetYear),
  }));

  document.getElementById("og-title-main").textContent = T[spec.titleKey];

  // x軸の定義域: 推計のtarget_year・実績のyearの両方を含めた最小〜最大
  // (fertility.js / births.js のallYearsと同じ規則)。bin/build.mjsの
  // fanCardInfo()も同じ規則でminYearを導くので、ここでずれると
  // bin/og.shのverify_domが誤爆する。
  const allYears = forecastRows.map((r) => r.targetYear).concat(actualRows.map((r) => r.year));
  const xMin = Math.min(...allYears), xMax = Math.max(...allYears);
  // フッタ: 扇形の2ページはどちらも「年度」ではなく暦年(CSVはyear/target_year。
  // fiscal_yearではない)。指標カード用のfooterRangeMetric(「…年度」/「FY…」)を
  // 流用すると、暦年しか持たない扇形カードに実在しない「年度」を書いてしまい
  // 内容として間違う。専用のfooterRangeCalendar(「…年」/年度接頭辞なし)を使う。
  document.getElementById("og-footer-range").textContent = T.footerRangeCalendar(xMin, xMax);

  // y軸の定義域: ページごとの規則(FAN_SPECSのyDomain。直上のコメント参照)。
  // og.html本体の指標カード用パディング(10%・0を含める)とはどちらも違う規則
  // なので、niceStep()等の一般化ロジックには乗せない。
  const allValues = forecastRows.map((r) => r.val).concat(actualRows.map((r) => r.val));
  const [yMin, yMax] = spec.yDomain(allValues);

  const x = (yr) => PAD.left + ((yr - xMin) / (xMax - xMin)) * (W - PAD.left - PAD.right);
  const y = (v) => PAD.top + (H - PAD.top - PAD.bottom) * (1 - (v - yMin) / (yMax - yMin));

  const svg = document.getElementById("og-svg");

  // x軸目盛: 10年刻み(fertility.js / births.js と同じ)。指標カードの5年刻みとは違う。
  for (let yr = Math.ceil(xMin / 10) * 10; yr <= xMax; yr += 10) {
    svg.appendChild(el("line", { class: "axis-line", x1: x(yr), x2: x(yr), y1: PAD.top, y2: H - PAD.bottom }));
    // font-size="15"は他のog.htmlのaxis-labelと同様、style.cssの
    // .axis-label{font-size:11px}に上書きされ実際には効いていない
    // (estimateLabelWidth直上コメント参照)。
    const t = el("text", { class: "axis-label", x: x(yr), y: H - PAD.bottom + 22, "text-anchor": "middle", "font-size": 15 });
    t.textContent = yr;
    svg.appendChild(t);
  }

  // y軸目盛: 刻みとラベルの書式はページごと(FAN_SPECSのyStep/yLabelKey)。
  // 出生率は0.2刻み・小数1桁(無単位)、出生数は200000刻み・「…万」/「….M」で、
  // それぞれ fertility.js / births.js のページ本体と同じ規則。指標カードの
  // ような一般の単位付与(metricUnit)には乗せない。
  const yLabel = T[spec.yLabelKey];
  for (let v = Math.ceil(yMin / spec.yStep) * spec.yStep; v <= yMax; v += spec.yStep) {
    const yy = y(v);
    svg.appendChild(el("line", { class: "grid-line-y", x1: PAD.left, x2: W - PAD.right, y1: yy, y2: yy }));
    const t = el("text", { class: "axis-label", x: PAD.left - 10, y: yy + 5, "text-anchor": "end", "font-size": 15 });
    t.textContent = yLabel(v);
    svg.appendChild(t);
  }

  // 実データがある年だけを、連続する年の並びごとに区切って結ぶ(欠測を直線で
  // 橋渡ししない)。fertility.js / births.js の
  // buildSegments/pathFromSegmentsと同じ規則。
  function segPath(rows, yearKey, valKey) {
    const segs = [];
    let cur = [];
    rows.forEach((r) => {
      if (cur.length && r[yearKey] - cur[cur.length - 1][yearKey] > 1) { segs.push(cur); cur = []; }
      cur.push(r);
    });
    if (cur.length) segs.push(cur);
    return segs.map((s) => "M " + s.map((r) => `${x(r[yearKey])},${y(r[valKey])}`).join(" L ")).join(" ");
  }

  // 版ごとの推計線: line-forecast-vintage(fertility.html/style.cssと同じ
  // クラス)。style.cssの#fertility-chart .line-forecast-vintageという太さの
  // 上書きはid違い(og.htmlのsvgはid="og-svg")のためここには効かず、既定
  // (stroke-width:1.25)がそのまま使われる。不透明度はfertility.jsの
  // opacityFor()と同じ規則(0.2+idx/(版数-1)*0.4。古い版ほど薄い。値の
  // 善し悪しではなく「いつの推計か」を表すという意図なので変えない)。
  byVintage.forEach(({ rows }, idx) => {
    const span = vintages.length - 1 || 1;
    const opacity = 0.2 + (idx / span) * 0.4;
    const p = el("path", { class: "line-forecast-vintage", d: segPath(rows, "targetYear", "val") });
    p.setAttribute("opacity", opacity.toFixed(2));
    svg.appendChild(p);
  });

  // 実績線: line-actual(指標カードと同じクラス)。太めに描くのも同じ
  // (stroke-width=3)。
  const ap = el("path", { class: "line-actual", d: segPath(actualRows, "year", "val") });
  ap.setAttribute("stroke-width", 3);
  svg.appendChild(ap);

  // 凡例: 指標カードの2項目(見通し/実績)とは中身が違う。扇は1本の「見通し」
  // ではなく歴代の推計(版ごと)なので、#og-legend-forecast側だけをこの分岐でのみ
  // 差し替える(#og-legend-actualはテキスト・スウォッチとも指標カードと同じで
  // よいため触らない)。スウォッチはfertility.htmlの凡例と同じ
  // .legend-swatch-vintage(実線・amber)に差し替え、テキストは
  // 「歴代N版の推計」にする(Nはvintage_yearの異なる値の個数からデータで
  // 導く。ハードコードしない)。この差し替えは扇形の分岐でしか実行
  // されないため、指標カード・汎用カードの凡例(#og-legend-forecastの既定
  // markup)は1バイトも変わらない。
  const forecastLabel = document.getElementById("og-legend-forecast");
  const forecastSwatch = forecastLabel.previousElementSibling;
  forecastSwatch.classList.remove("og-legend-swatch-forecast");
  forecastSwatch.classList.add("legend-swatch-vintage");
  forecastLabel.textContent = T.legendFan(vintages.length);
}

async function main() {
  const m = params.get("m");
  // FAN_SPECSのキー(fertility / births)は予約値: chart.jsのMETRICSを引く前に
  // ここで分岐する。METRICSに同名のキーが将来足された場合は、bin/build.mjsの
  // OG_CARDSの出力先パス一意性検査がassets/og-<キー>.pngの衝突として捕まえる
  // (2026-07-30、bin/build.mjsで実際に確認済み。壊し試験8参照)。
  if (m && FAN_SPECS[m]) {
    await renderFan(FAN_SPECS[m]);
    return;
  }
  let metric = null;
  let metricUnitFn = null;
  if (m) {
    const mod = await loadChartModule();
    metric = mod.METRICS[m];
    // METRICSに無く、FAN_SPECSにも無いキーは黙って汎用カードへフォール
    // バックしない(フォールバックすると「焼けたのに中身が違う」が静かに
    // 通ってしまう)。
    if (!metric) throw new Error(`?m=${m} は chart.js の METRICS に無い指標キー(og.htmlのFAN_SPECS: ${Object.keys(FAN_SPECS).join("/")} も受け付けるが、それでもない)`);
    metricUnitFn = mod.metricUnit;
  }

  document.getElementById("og-title-main").textContent = metric
    ? (LANG === "ja" ? metric.title : metric.titleEn)
    : T.titleMain;

  // CSVパスとforecast/actual列名: ?mなしは従来どおり実質GDP固定。?mありは
  // chart.jsのMETRICSが持つ定義をそのまま使う(定義の複製をog.html側に
  // 作らない)。metric.csvは"/data/..."というルート絶対パス。og.html自身も
  // リポジトリルート直下にあり、bin/og.shが立てるローカルサーバの
  // ドキュメントルートもリポジトリルートなので、絶対パスのままfetchしても
  // (先頭の/を落として相対にしても)同じファイルに解決する。ここでは
  // chart.js側の書式(絶対パス)をそのまま使う: パスの変換ロジックをog.html側に
  // 新設せずに済み、chart.js側の書式が変わってもここが追随できるため。
  const csvPath = metric ? metric.csv : "data/gdp_forecast.csv";
  const forecastCol = metric ? metric.forecastCol : "forecast_real";
  const actualCol = metric ? metric.actualCol : "actual_real";

  const rows = (await loadCSV(csvPath))
    .map((r) => ({
      year: Number(r.fiscal_year),
      f: toNum(r[forecastCol]),
      a: toNum(r[actualCol]),
    }))
    .sort((x, y) => x.year - y.year);

  // x軸(年度)の定義域は「見通し列か実績列のどちらかに値がある行」だけから
  // 取る(全行の年度からではない)。data/gdp_forecast.csvは実質・名目で1つの
  // CSVを共有しているので、たとえば翌年度の行が実質だけ埋まった状態で
  // 追加されると、名目のカードだけ右端に空白の1年が伸びてしまう。
  // 2026-07-30時点では全8指標で「全行」と「値のある行」の年度範囲が一致して
  // いるため、この変更で既存の汎用2枚(og.png/og-en.png)は変わらない
  // (将来ずれたときに、これが意図した差分だと分かるようにこの事実を残す)。
  const domainRows = rows.filter((r) => r.f !== null || r.a !== null);
  const domainYears = domainRows.map((r) => r.year);
  const xMin = Math.min(...domainYears), xMax = Math.max(...domainYears);
  // フッタの年度ラベル: ?mなし(汎用カード)は指標名+年度レンジ(従来どおり)。
  // ?mあり(指標カード)は年度レンジのみ(OG_TEXTのfooterRangeMetricコメント
  // 参照)。
  document.getElementById("og-footer-range").textContent = metric
    ? T.footerRangeMetric(xMin, xMax)
    : T.footerRange(xMin, xMax);

  // y軸の定義域は従来どおり: 値の最大最小に10%のパディングを加え、0を含める。
  // ここは変更しない。
  const vals = rows.flatMap((r) => [r.f, r.a]).filter((v) => v !== null);
  const yPad = (Math.max(...vals) - Math.min(...vals)) * 0.1;
  const yMin = Math.min(...vals, 0) - yPad, yMax = Math.max(...vals, 0) + yPad;

  const { kMin, kMax, base, exp } = niceStep(yMin, yMax);
  const unit = metric ? metricUnitFn(metric, LANG) : "%";
  // 目盛ラベルの最大幅を見積もり、はみ出さないようPAD.leftを広げる。
  // Math.max(..., 52)の下限があるため、%指標(ラベルが短い)では従来の52が
  // そのまま採られ既存2枚のPNGは変わらない。見積もりであって実測ではない点は
  // estimateLabelWidth直上のコメントのとおり。
  let maxTickWidth = 0;
  for (let k = kMin; k <= kMax; k++) {
    maxTickWidth = Math.max(maxTickWidth, estimateLabelWidth(tickLabel(k, base, exp) + unit));
  }
  PAD.left = Math.max(52, maxTickWidth + 12);

  const x = (yr) => PAD.left + ((yr - xMin) / (xMax - xMin)) * (W - PAD.left - PAD.right);
  const y = (v) => PAD.top + (H - PAD.top - PAD.bottom) * (1 - (v - yMin) / (yMax - yMin));

  const svg = document.getElementById("og-svg");

  svg.appendChild(el("line", { class: "zero-line", x1: PAD.left, x2: W - PAD.right, y1: y(0), y2: y(0) }));
  for (let yr = xMin; yr <= xMax; yr += 5) {
    svg.appendChild(el("line", { class: "axis-line", x1: x(yr), x2: x(yr), y1: PAD.top, y2: H - PAD.bottom }));
    // font-size="15"はstyle.cssの.axis-label{font-size:11px}に上書きされ実際には
    // 効いていない(estimateLabelWidth直上コメント参照)。値は変えない。
    const t = el("text", { class: "axis-label", x: x(yr), y: H - PAD.bottom + 22, "text-anchor": "middle", "font-size": 15 });
    t.textContent = yr;
    svg.appendChild(t);
  }
  // 従来の `for (let v = -4; v <= 6; v += 2)` (実質GDP専用・2刻み・%決め打ち)
  // を、上のniceStep()が決めたkMin/kMax/base/expに載せ替えた。税収(23〜84兆円)
  // や国債発行総額(23〜257兆円)では-4〜6の2刻みが破綻するため、2026-07-30に
  // 一般化した。ゼロ線は従来どおりこことは別に1本だけ引く(上のzero-line)。
  for (let k = kMin; k <= kMax; k++) {
    const label = tickLabel(k, base, exp);
    const v = Number(label);
    if (v !== 0) svg.appendChild(el("line", { class: "grid-line-y", x1: PAD.left, x2: W - PAD.right, y1: y(v), y2: y(v) }));
    // font-size="15"はstyle.cssの.axis-label{font-size:11px}に上書きされ実際には
    // 効いていない(estimateLabelWidth直上コメント参照)。値は変えない。
    const t = el("text", { class: "axis-label", x: PAD.left - 10, y: y(v) + 5, "text-anchor": "end", "font-size": 15 });
    t.textContent = label + unit;
    svg.appendChild(t);
  }

  function path(key) {
    const pts = rows.filter((r) => r[key] !== null);
    const segs = [];
    let cur = [];
    pts.forEach((r) => {
      if (cur.length && r.year - cur[cur.length - 1].year > 1) { segs.push(cur); cur = []; }
      cur.push(r);
    });
    if (cur.length) segs.push(cur);
    return segs.map((s) => "M " + s.map((r) => `${x(r.year)},${y(r[key])}`).join(" L ")).join(" ");
  }

  const fp = el("path", { class: "line-forecast", d: path("f") });
  fp.setAttribute("stroke-width", 2.25);
  svg.appendChild(fp);
  const ap = el("path", { class: "line-actual", d: path("a") });
  ap.setAttribute("stroke-width", 3);
  svg.appendChild(ap);
}
// フォントが載らないまま焼けた回を、PNGを見て気づくのではなくDOMの側で機械的に
// 捕まえるための印。IBM Plex Mono は**ウェブフォント**であり(焼く機械にローカル
// インストールしないこと。入れるとこの検査は webfont が壊れていても通ってしまう)、
// 当たらなければフォールバックの素のサンセリフで焼ける。2026-08-01に
// assets/og-fertility-en.png が実際にそうなり、データと線は正しいのにワードマーク
// だけがサンセリフになった。レビューで og-cpi-en.png と2枚を目視比較して初めて
// 見つかっている。**PNGの中身は誰も検査していない**(bin/build.mjs の --check は
// 入力のハッシュしか見ない)ので、DOM側にこの印を出させるのが唯一の機械的な手当て。
//
// 当時は style.css の1行目が Google Fonts を @import しており、取得が
// --virtual-time-budget の内に間に合わないのが壊れ方だった。2026-08-03に
// assets/fonts/ の woff2 を @font-face で読む自前ホストへ移したのでその経路は
// 消えたが、src のパス違い・ファイルの取り違え・unicode-range の書き損じで
// 同じ結果になるため、この印は残す。
//
// **document.fonts.check() は使えない。** 一見これ用のAPIに見えるが、
// 宣言の無いフォント名を渡すとフォールバックで描けるので true を返す仕様で、
// false になるのは「宣言済みのウェブフォントがまだ読み込み中」のときだけ。
// つまり @import 自体が失敗して FontFace が1つも作られなかった場合
// (= 当時実際に起きた壊れ方)には true を返し、何も検出しない。
// 2026-08-01に一度この実装で書き、存在しないフォント名に差し替える負のテストで
// 20枚とも素通りすることを確認して捨てた。
//
// 代わりに**実際に描かれた幅を測る**。同じ文字列を "IBM Plex Mono", monospace と
// monospace だけで描いて幅が変わらなければ、ウェブフォントが当たっていない。
// document.fonts.ready を待ってから測る(取得の途中で測ると、正常な回でも
// フォールバックの幅を拾う)。
//
// **ウェイトごとに測る(400/500/600)。** 自前ホスト化まではこれを400の1回しか
// やっていなかった。@import は all-or-nothing で落ちるので当時はそれで足りたが、
// いまは @font-face が15本あり「600の3本だけ src を打ち間違える」という部分故障が
// 起こり得る。ワードマーク(.og-brand-name)は 600 なので、400だけ測る検査は
// 2026-08-01とまったく同じ絵を素通りさせる(2026-08-03のレビューで指摘)。
// style.css が宣言しているウェイトと同じ3つを、宣言側を唯一の出所にはできない
// (og.htmlからCSSの@font-faceを機械的に読む手段が無い)ため、ここに書き下している。
// ウェイトを増減したらここも直すこと。
//
// main() が投げた場合はこの then が走らず印も立たないので、そのときも
// bin/og.sh の verify_dom 側で止まる。
main().then(async () => {
  // document.fonts.ready は「いま描画に必要なフォント」しか待たない。og.html が
  // 実際に描くのは 400 と 600 だけなので、500 の FontFace は ready の時点で
  // 未ロードのままになり、測定用のspanを足した瞬間に遅れて読み込みが始まって
  // **正常な回でもフォールバック幅を拾って落ちる**(2026-08-03、3ウェイト化した
  // 直後に1枚目で実際に落ちた)。測る前に測る文字列で明示的にロードさせる。
  // なお load() 自体は検査にならない(宣言の無いファミリでも空配列で解決する。
  // check() が使えないのと同じ理由)。検査はあくまで下の幅の比較。
  const PROBE_TEXT = "zurekei0123456789";
  const WEIGHTS = [400, 500, 600];
  await Promise.all(
    WEIGHTS.map((w) => document.fonts.load(`${w} 64px "IBM Plex Mono"`, PROBE_TEXT))
  );
  await document.fonts.ready;
  const probe = (family, weight) => {
    const s = document.createElement("span");
    s.textContent = PROBE_TEXT;
    s.style.cssText =
      "position:absolute;left:-9999px;top:-9999px;white-space:pre;font-size:64px;font-weight:" +
      weight +
      ";font-family:" +
      family;
    document.body.appendChild(s);
    const w = s.getBoundingClientRect().width;
    s.remove();
    return w;
  };
  const ok = WEIGHTS.every(
    (w) => probe('"IBM Plex Mono", monospace', w) !== probe("monospace", w)
  );
  document.documentElement.setAttribute("data-font-ok", ok ? "1" : "0");
});
</script>
</body>
</html>
